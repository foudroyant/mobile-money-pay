{{define "content"}}
<header class="topbar">
  <span class="brand">MomoPay CG · Admin</span>
  <form method="post" action="/admin/logout">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="btn secondary small">Déconnexion</button>
  </form>
</header>
<main>
  <nav class="tabs">
    <a href="/admin">Transactions</a>
    <a href="/admin/links">Liens de paiement</a>
    <a href="/admin/merchants" class="active">Marchands</a>
    <a href="/admin/reconcile">Rapprochement</a>
  </nav>

  <div class="card">
    <h2>Nouveau marchand</h2>
    <form hx-post="/admin/merchants" hx-target="#merchants-panel" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
      <div class="field">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email (identifiant de connexion)</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe initial</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </div>
      <button type="submit" class="btn">Créer le marchand</button>
    </form>
  </div>

  <div class="card">
    <h2>Marchands</h2>
    {{template "merchants_panel" .}}
  </div>
</main>
{{end}}
