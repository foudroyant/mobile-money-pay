{{define "content"}}
<header class="topbar">
  <span class="brand">MomoPay CG · Admin</span>
  <form method="post" action="/admin/logout">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="btn secondary small">Déconnexion</button>
  </form>
</header>
<main>
  <nav class="tabs">
    <a href="/admin" class="active">Transactions</a>
    <a href="/admin/merchants">Marchands</a>
    <a href="/admin/reconcile">Rapprochement</a>
  </nav>

  <div class="card">
    <h2>Nouveau lien de paiement</h2>
    <form hx-post="/admin/transactions" hx-swap="none" hx-on::after-request="if(event.detail.successful) this.reset()">
      <div class="field">
        <label for="merchant">Marchand</label>
        <select id="merchant" name="merchant" required>
          {{range .Merchants}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
        </select>
      </div>
      <div class="field">
        <label for="amount">Montant (FCFA)</label>
        <input type="number" id="amount" name="amount" min="1" step="1" required>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" name="description">
      </div>
      <button type="submit" class="btn">Créer le lien</button>
    </form>
  </div>

  <div class="card">
    <h2>Transactions</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Marchand</th><th>Montant</th><th>Description</th><th>Statut</th><th>Réf. payeur</th><th>Lien</th><th>Détails</th><th>Actions</th></tr>
        </thead>
        <tbody id="txn-rows" hx-ext="sse" sse-connect="/admin/stream" sse-swap="txn-new,txn-update" hx-swap="afterbegin">
          {{range .Rows}}{{template "txn_row_new" .}}{{end}}
        </tbody>
      </table>
    </div>
  </div>
</main>
{{end}}
